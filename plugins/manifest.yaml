plugins:
  # ─────────────────────────────────────────────────────────────────────────────
  # manifest.yaml — lightweight default (Claude Code / personal single-user mode)
  #
  # This file contains only the plugins relevant for everyday personal use.
  # Full plugin catalog (A/B router, shadow traffic, latency SLA guard, canary
  # detector, topic blocklist, tenant QoS, schema enforcer, etc.) is in
  # manifest.full.yaml — copy individual entries here to opt in.
  # ─────────────────────────────────────────────────────────────────────────────

  # ── INGRESS ────────────────────────────────────────────────────────────────

  - name: "Ingress Auth & Zero-Trust"
    hook: "ingress"
    priority: 10
    # Personal / single-user mode: disabled so the real upstream API key
    # (e.g. ANTHROPIC_API_KEY held by Claude Code) flows through transparently.
    # Team mode: set enabled: true + configure LLM_PROXY_API_KEYS=token1,token2
    enabled: false
    version: "1.0.0"
    entrypoint: "default.ingress_auth:verify"

  # ── PRE_FLIGHT ─────────────────────────────────────────────────────────────

  # Smart Budget Guard — not needed in personal single-user mode (no spend cap
  # to enforce against yourself). Full config lives in manifest.full.yaml;
  # copy the block back here to opt in for team/multi-key usage.

  - name: "Agentic Loop Breaker"
    hook: "pre_flight"
    priority: 12
    enabled: true
    fail_policy: "closed"
    type: "python"
    entrypoint: "marketplace.agentic_loop_breaker:AgenticLoopBreaker"
    version: "1.0.0"
    author: "llmproxy"
    description: "Detects and breaks agentic retry loops via prompt hashing"
    timeout_ms: 10
    config:
      max_repeats: 3
      window_seconds: 120
      hash_messages: 3
    ui_schema:
      - key: "max_repeats"
        type: "number"
        label: "Max Repeats"
        description: "Number of identical prompts before blocking"
        default: 3
        min: 2
        max: 20
      - key: "window_seconds"
        type: "number"
        label: "Window (seconds)"
        description: "Sliding window for repeat detection"
        default: 120
        min: 30
        max: 600
      - key: "hash_messages"
        type: "number"
        label: "Messages to Hash"
        description: "Number of trailing messages to fingerprint"
        default: 3
        min: 1
        max: 10

  - name: "PII Neural Masker"
    hook: "pre_flight"
    priority: 20
    # Legacy Presidio masker — superseded by ONNX PII Masker below.
    # Keep disabled unless reverting from ONNX to Presidio.
    enabled: false
    fail_policy: "closed"
    version: "1.0.0"
    entrypoint: "default.pii_masker:mask"

  - name: "ONNX PII Masker"
    hook: "pre_flight"
    priority: 19
    enabled: true
    fail_policy: "open"
    type: "python"
    entrypoint: "installed.onnx_pii_masker:OnnxPiiMasker"
    version: "1.2.8"
    author: "llmproxy-extended"
    description: "PII masking via OpenAI Privacy Filter NER (ONNX) + regex person-name fallback. 8 categories: PRIVATE_PERSON, PRIVATE_EMAIL, PRIVATE_PHONE, PRIVATE_ADDRESS, PRIVATE_URL, PRIVATE_DATE, ACCOUNT_NUMBER, SECRET."
    # v1.2.8: NER inference now runs via run_in_executor (was blocking the asyncio
    # event loop synchronously — see headroom_compressor.py v1.4.0 for the same fix
    # and full rationale). timeout_ms now actually enforced too (plugin_engine.py
    # bug fix, 2026-07-02) — raised 2000 -> 10000 -> 60000: even 10000ms still
    # timed out routinely on laptop-class CPU under concurrent load (large
    # system prompt + Kompress competing for the same cores). fail_policy=open
    # means a timeout here lets PII through unmasked, so generous > tight.
    timeout_ms: 60000
    config:
      model_id: "openai/privacy-filter"
      variant: "int8"
      backend: "auto"
      force_cpu: false
      debug_input_only: true  # masks input but skips vault → response keeps placeholders; DO NOT enable in production
    ui_schema:
      - key: "variant"
        type: "select"
        label: "Model Variant"
        description: "ONNX quantization variant. int8 recommended (1.6 GB, DML-safe on Windows)."
        default: "int8"
        options: ["int8", "fp16", "fp32", "q4", "q4f16"]
      - key: "backend"
        type: "select"
        label: "Inference Backend"
        description: "auto = DirectML if available (int8 only), otherwise CPU."
        default: "auto"
        options: ["auto", "cpu", "directml"]

  - name: "Headroom Compressor"
    hook: "pre_flight"
    priority: 25
    # use_kompress: true — full ML pipeline (Kompress ModernBERT ONNX + structural
    # compressors). Model loads eagerly at startup in a background thread so the
    # first real request finds it warm (no 15-17s cold-start latency on first call).
    # RAM cost: ~600 MB (Kompress ModernBERT) on top of the 1.77 GB ONNX PII model.
    #
    # Set use_kompress: false for structural-only (SmartCrusher, LogCompressor,
    # SearchCompressor) — no Kompress model, instant, zero-ML, ~0 extra RAM.
    #
    # v1.4.0: JSON-object tool_result pre-processing via SmartCrusher.compact_document_json().
    # MCP results wrapped in {"ok":true,"data":{...}} are now compacted before
    # ContentRouter runs, filling the routing gap for non-array JSON root content.
    #
    # timeout_ms: previously 5000, but plugin_engine.py silently ignored manifest
    # timeout_ms for class-mode plugins (bug fixed 2026-07-02 — see plugin_engine.py
    # timeout_ms override note), so the real enforced value was always the class
    # default. Compress calls also now run via run_in_executor (headroom_
    # compressor.py v1.4.0), so a slow Kompress inference no longer blocks the
    # event loop / other concurrent requests — a generous timeout is now safe
    # (it used to mean a frozen server; now it just means a slower response).
    # Set to 130000 to sit above Kompress's own internal wall-clock deadline
    # (HEADROOM_COMPRESSION_DEADLINE_MS in .env, raised to 120000 for laptop-
    # class CPUs — see .env.example) so our plugin timeout never cuts Kompress
    # off before its own deadline does.
    enabled: true
    fail_policy: "open"
    type: "python"
    entrypoint: "installed.headroom_compressor:HeadroomCompressor"
    version: "1.4.0"
    author: "llmproxy-extended"
    description: "Context compression via headroom-ai. use_kompress=false: structural only, no torch. use_kompress=true: full ML. Requires: pip install headroom-ai[ml,code]"
    timeout_ms: 130000
    config:
      min_tokens_to_compress: 200
      use_kompress: true
    ui_schema:
      - key: "min_tokens_to_compress"
        type: "number"
        label: "Min Words to Compress"
        description: "Skip compression for messages shorter than this word count."
        default: 200
        min: 50
        max: 2000
      - key: "use_kompress"
        type: "boolean"
        label: "Use Kompress ML"
        description: "Enable Kompress (ModernBERT ONNX) for text compression. Loads torch (~2 GB RAM). Set false for structural-only compression (SmartCrusher, LogCompressor) without ML."
        default: false

  # ── ROUTING ────────────────────────────────────────────────────────────────

  - name: "Smart Router"
    hook: "routing"
    priority: 50
    enabled: true
    version: "1.3.0"
    entrypoint: "default.smart_router:select_endpoint"

  # ── POST_FLIGHT ────────────────────────────────────────────────────────────

  - name: "Speculative Kill-Switch"
    hook: "post_flight"
    priority: 70
    enabled: true
    version: "1.0.0"
    entrypoint: "default.kill_switch:analyze"

  - name: "Post-Flight Sanitizer"
    hook: "post_flight"
    priority: 80
    enabled: true
    version: "1.0.0"
    entrypoint: "default.shield_sanitizer:cleanse"

  - name: "JSON Auto-Healer"
    hook: "post_flight"
    priority: 90
    enabled: true
    version: "1.0.0"
    entrypoint: "default.json_healer:repair"

  # ── BACKGROUND ─────────────────────────────────────────────────────────────

  - name: "Unified Telemetry & FinOps"
    hook: "background"
    priority: 100
    enabled: true
    version: "1.1.0"
    entrypoint: "default.telemetry_ops:record"
